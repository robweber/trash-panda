{% extends "base.html" %}
{% block content %}
<div class="container">
  <p>Click on a group name to see the overall status of hosts in that group.</p>
  <ul>
    {% for g in groups: %}
    <li>
      <a href="/dashboard/status/group?group={{ g }} ">{{ g }}</a>
    </li>
    {% endfor %}
  </ul>
</div>
{% endblock %}
